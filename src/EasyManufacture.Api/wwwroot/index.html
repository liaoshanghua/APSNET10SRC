  <h1>EasyManufacture API（.NET 10）</h1>
  <p>本站点为 Web API，没有旧版 MVC 首页。请使用下列地址联调：</p>
  <ul>
    <li><a href="/APSAPI/Ping">/APSAPI/Ping</a> — 健康检查</li>

    <li><code>POST /Login/CheckAccount</code> — 登录</li>
  </ul>
